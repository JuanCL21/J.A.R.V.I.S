<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JARVIS — AI Orb Prototype v2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #030409;
    overflow: hidden;
    height: 100%;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }
  #caption {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    color: #cfe3f5;
    font-family: 'SFMono-Regular', 'Consolas', monospace;
    font-size: 15px;
    letter-spacing: 0.3px;
    text-align: center;
    min-height: 20px;
    max-width: 460px;
    opacity: 0.92;
    text-shadow: 0 0 12px rgba(120, 170, 255, 0.25);
    transition: opacity 0.4s ease;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="orb"></canvas>
  <div id="caption"></div>
</div>

<script>
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
const captionEl = document.getElementById('caption');
const hintEl = { style: {} };
const demoBtn = null;

let W, H, CX, CY;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2 - H * 0.04;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------
// SISTEMA DE COLOR CONTEXTUAL
// El color nunca es aleatorio: cada "contexto" define un tono fijo con
// significado. Hoy solo existe el contexto NEUTRAL (familia azul), pero
// la estructura ya soporta agregar contextos futuros disparados por lo
// que se detecta en la conversación (ej. sentimiento, tema, intención),
// no por el estado técnico (reposo/escuchando/hablando) — el estado
// técnico solo modula intensidad y ritmo, nunca el tono base.
// ---------------------------------------------------------------------

const COLOR_CONTEXTS = {
  neutral: { hue: 216 }, // única familia activa por ahora: azul
};
let activeContext = 'neutral';

// Parámetros por ESTADO TÉCNICO (nunca cambian el hue, solo cómo se
// comporta la luz dentro de ese hue: brillo, ritmo, quietud).
const STATE_PARAMS = {
  idle: {
    breatheAmp: 0.025,
    breatheSpeed: 0.35,
    coreLight: 97,
    midLight: 80,
    edgeLight: 52,
    sat: 55,
    haloStrength: 0.6,
    highlightDrift: 0.08,
  },
  listening: {
    breatheAmp: 0.006,        // casi quieto: atención
    breatheSpeed: 0.15,
    coreLight: 99,
    midLight: 85,
    edgeLight: 58,
    sat: 50,
    haloStrength: 0.7,
    highlightDrift: 0.22,     // el brillo interno reacciona más rápido
  },
  thinking: {
    breatheAmp: 0.045,        // pulsación concentrada de pensamiento
    breatheSpeed: 2.2,        // ritmo dinámico reflexivo
    coreLight: 98,
    midLight: 82,
    edgeLight: 54,
    sat: 68,
    haloStrength: 0.84,
    highlightDrift: 0.42,
  },
  speaking: {
    breatheAmp: 0.05,
    breatheSpeed: 1.5,        // ritmo marcado, distinto a escuchar
    coreLight: 96,
    midLight: 75,
    edgeLight: 46,
    sat: 62,
    haloStrength: 0.78,
    highlightDrift: 0.3,
  },
};

let current = { ...STATE_PARAMS.idle };
let target = STATE_PARAMS.idle;
let stateName = 'idle';
function setState(name) {
  if (STATE_PARAMS[name]) {
    stateName = name;
    target = STATE_PARAMS[name];
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }
function updateCurrent(dt) {
  const s = 1 - Math.pow(0.0008, dt);
  for (const k in target) current[k] = lerp(current[k], target[k], s);
}

// Nivel de audio modulado en tiempo real por el micrófono o Gemini Live
let audioLevel = 0, audioTarget = 0;
function updateAudio(dt) {
  if (stateName === 'listening') audioTarget = Math.max(audioTarget * 0.94, 0.12);
  else if (stateName === 'thinking') audioTarget = 0.2 + Math.abs(Math.sin(t * 8)) * 0.22;
  else if (stateName === 'speaking') audioTarget = Math.max(audioTarget * 0.94, 0.25 + Math.abs(Math.sin(t * 7)) * 0.45);
  else audioTarget = 0.05;
  audioLevel = lerp(audioLevel, audioTarget, 1 - Math.pow(0.001, dt));
}

let t = 0;
let lastTime = performance.now();
const baseRadius = 100;

function draw() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  t += dt;

  updateCurrent(dt);
  updateAudio(dt);

  const hue = COLOR_CONTEXTS[activeContext].hue;
  const breathe = 1 + Math.sin(t * current.breatheSpeed) * current.breatheAmp;
  const R = baseRadius * breathe + audioLevel * 10;

  // desplazamiento del highlight: sutil, orgánico, sin deformar el borde
  const hx = Math.cos(t * current.highlightDrift) * R * 0.16;
  const hy = Math.sin(t * current.highlightDrift * 0.8) * R * 0.14;

  ctx.clearRect(0, 0, W, H);

  // --- halo ambiental grande, bleeding hacia arriba (como la referencia) ---
  ctx.save();
  ctx.filter = 'blur(70px)';
  const haloR = R * 5.5;
  const halo = ctx.createRadialGradient(CX, CY - R * 0.3, 0, CX, CY - R * 0.3, haloR);
  halo.addColorStop(0, `hsla(${hue}, 75%, 58%, ${0.42 * current.haloStrength})`);
  halo.addColorStop(0.4, `hsla(${hue}, 75%, 42%, ${0.22 * current.haloStrength})`);
  halo.addColorStop(1, `hsla(${hue}, 70%, 20%, 0)`);
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(CX, CY - R * 0.3, haloR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- halo cercano, más ajustado al cuerpo (más claro, hace de puente) ---
  ctx.save();
  ctx.filter = 'blur(24px)';
  const nearHalo = ctx.createRadialGradient(CX, CY, R * 0.5, CX, CY, R * 2.1);
  nearHalo.addColorStop(0, `hsla(${hue}, 70%, 68%, ${0.55 * current.haloStrength})`);
  nearHalo.addColorStop(1, `hsla(${hue}, 70%, 55%, 0)`);
  ctx.fillStyle = nearHalo;
  ctx.beginPath();
  ctx.arc(CX, CY, R * 2.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- cuerpo: esfera suave, sin borde duro (se funde con el halo) ---
  ctx.save();
  ctx.filter = 'blur(3px)';
  const bodyR = R * 1.22;
  const bodyGrad = ctx.createRadialGradient(
    CX + hx - R * 0.28, CY + hy - R * 0.32, R * 0.02,
    CX, CY, bodyR
  );
  bodyGrad.addColorStop(0, `hsla(${hue - 4}, ${current.sat - 20}%, ${current.coreLight}%, 1)`);
  bodyGrad.addColorStop(0.4, `hsla(${hue}, ${current.sat}%, ${current.midLight}%, 1)`);
  bodyGrad.addColorStop(0.78, `hsla(${hue + 4}, ${current.sat}%, ${current.edgeLight}%, 0.9)`);
  bodyGrad.addColorStop(1, `hsla(${hue + 4}, ${current.sat}%, ${current.edgeLight}%, 0)`);
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, bodyR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- highlight puntual, da sensación de material/vidrio ---
  ctx.save();
  ctx.filter = 'blur(6px)';
  ctx.globalCompositeOperation = 'lighter';
  const hi = ctx.createRadialGradient(
    CX + hx - R * 0.3, CY + hy - R * 0.34, 0,
    CX + hx - R * 0.3, CY + hy - R * 0.34, R * 0.4
  );
  hi.addColorStop(0, `hsla(${hue - 10}, 60%, 96%, 0.55)`);
  hi.addColorStop(1, `hsla(${hue}, 60%, 96%, 0)`);
  ctx.fillStyle = hi;
  ctx.beginPath();
  ctx.arc(CX + hx - R * 0.3, CY + hy - R * 0.34, R * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// --- subtitulado en vivo (idéntico comportamiento al prototipo anterior) ---
let captionTimer = null;
function typeCaption(text, delay = 28) {
  clearTimeout(captionTimer);
  captionEl.textContent = '';
  captionEl.style.opacity = '0.92';
  let i = 0;
  (function step() {
    captionEl.textContent = text.slice(0, i++);
    if (i <= text.length) captionTimer = setTimeout(step, delay);
  })();
}
function clearCaptionSoon(delay = 1400) {
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => {
    captionEl.style.opacity = '0';
    setTimeout(() => { captionEl.textContent = ''; }, 400);
  }, delay);
}

let sequenceRunning = false;
function runInteractionOnce() {
  if (sequenceRunning) return;
  sequenceRunning = true;

  setState('listening');
  typeCaption('Escuchando...', 40);

  setTimeout(() => {
    setState('speaking');
    typeCaption('Hola, ¿en qué puedo ayudarte hoy?', 26);
  }, 1600);

  setTimeout(() => {
    setState('idle');
    clearCaptionSoon(200);
    sequenceRunning = false;
  }, 4600);
}

function handleOrbClick() {
  if (stateName === 'speaking' || stateName === 'thinking') {
    // Interrupción del usuario (Barge-in / Gemini Live)
    setState('listening');
    typeCaption('Escuchando...', 30);
  } else if (stateName === 'idle') {
    setState('listening');
    typeCaption('Escuchando...', 30);
  } else if (stateName === 'listening') {
    setState('thinking');
    typeCaption('Pensando...', 30);
  }
}
canvas.addEventListener('click', handleOrbClick);

window.setState = setState;
window.typeCaption = typeCaption;
window.clearCaptionSoon = clearCaptionSoon;
window.runInteractionOnce = runInteractionOnce;
window.interrupt = function() {
  setState('listening');
  typeCaption('Escuchando...', 30);
};
</script>
</body>
</html>
